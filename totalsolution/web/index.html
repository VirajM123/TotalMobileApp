<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="totalsolution">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>totalsolution</title>
  <link rel="manifest" href="manifest.json">
  <script src="maps_api_key.js"></script>
  <script>
    // google_maps_flutter_web 0.6.3 reads legacy globals such as
    // google.maps.MapTypeId during startup. Load Maps completely before
    // booting Flutter so those globals are available.
    window.addEventListener('load', function () {
      const bootFlutter = function () {
        const flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js';
        flutterScript.async = true;
        document.body.appendChild(flutterScript);
      };

      if (!window.googleMapsApiKey) {
        console.error('Google Maps JavaScript API key is missing.');
        bootFlutter();
        return;
      }

      const mapsScript = document.createElement('script');
      mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(window.googleMapsApiKey) + '&v=weekly';
      mapsScript.async = true;
      mapsScript.onload = bootFlutter;
      mapsScript.onerror = function () {
        console.error('Google Maps JavaScript API failed to load.');
        bootFlutter();
      };
      document.head.appendChild(mapsScript);
    });
  </script>
</head>
<body></body>
</html>
